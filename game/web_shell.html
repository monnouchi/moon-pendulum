<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b28"><meta name="description" content="月を引いて放し、鐘と光を奏でる。鐘から月へ、音と力がつながるGodot製の音楽物理ゲーム。"><title>月の振り子 · Moon Pendulum</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071b28;color:#ecd7a4;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:22px;text-align:center;background:radial-gradient(ellipse at 50% 38%,#17333e,#071b28 70%);padding:26px}#loading h1{font-size:clamp(24px,5vw,38px);font-weight:400;letter-spacing:.15em;margin:0}#loading p{color:#9bb3b8;font-size:14px;line-height:1.8;margin:0;max-width:440px}progress{width:240px;max-width:80vw;height:5px;border:0;border-radius:10px;overflow:hidden;margin:auto;background:#28454e}progress::-webkit-progress-bar{background:#28454e}progress::-webkit-progress-value{background:#d8cf9e}#retry{display:none;border:1px solid #5c8484;background:#133540;color:#e8efea;border-radius:8px;padding:13px 18px;cursor:pointer}noscript{position:absolute;inset:0;padding:20vh 10vw;background:#071b28;color:#e8efea}
</style>$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="0" aria-label="月の振り子。マウスまたはタッチで月を左右に引いて放します。キーボードは左右矢印で角度を調整し、Spaceで放します。Rで引き直し、Mでミュート。">WebGL 2.0 対応ブラウザで開いてください。</canvas><div id="loading" role="status" aria-live="polite"><h1>月の振り子</h1><p id="message">夜の支度をしています。<br>初回はゲームエンジンの読み込みに少し時間がかかります。</p><progress id="progress"></progress><button id="retry" onclick="location.reload()">もう一度読み込む</button></div><noscript>このゲームには JavaScript と WebGL 2.0 が必要です。</noscript><script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;const game=new Engine(config);window.moonPendulumEngine=game;
const loading=document.getElementById('loading'),message=document.getElementById('message'),bar=document.getElementById('progress');
function fail(error){message.textContent='読み込みを完了できませんでした。WebGL 2.0 対応の Chrome / Firefox / Safari でお試しください。詳細: '+String(error);bar.hidden=true;document.getElementById('retry').style.display='block';console.error(error)}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail(missing.join(', '))}else{game.startGame({canvas:document.getElementById('canvas'),onProgress:(loaded,total)=>{if(total>0){bar.max=total;bar.value=loaded}}}).then(()=>{loading.hidden=true;loading.style.display='none';document.getElementById('canvas').focus()}).catch(fail)}
</script></body></html>
